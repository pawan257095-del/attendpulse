<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" />

  <!-- Clipboard / Register Base -->
  <rect x="96" y="96" width="320" height="340" rx="36" fill="url(#cardGrad)" filter="url(#shadow)" />

  <!-- Top Clip -->
  <rect x="186" y="70" width="140" height="52" rx="16" fill="#312e81" />
  <rect x="216" y="86" width="80" height="20" rx="10" fill="#a5b4fc" />

  <!-- Attendance rows -->
  <!-- Row 1: Present (Green) -->
  <circle cx="152" cy="180" r="18" fill="#10b981" />
  <path d="M144 180l6 6 12-12" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="190" y="170" width="150" height="20" rx="10" fill="#e2e8f0" />
  <rect x="354" y="166" width="40" height="28" rx="8" fill="#d1fae5" />
  <text x="374" y="185" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#065f46" text-anchor="middle">P</text>

  <!-- Row 2: Half Day (Yellow) -->
  <circle cx="152" cy="240" r="18" fill="#f59e0b" />
  <path d="M144 240h16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <rect x="190" y="230" width="130" height="20" rx="10" fill="#e2e8f0" />
  <rect x="354" y="226" width="40" height="28" rx="8" fill="#fef3c7" />
  <text x="374" y="245" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">HD</text>

  <!-- Row 3: Overtime (Purple) -->
  <circle cx="152" cy="300" r="18" fill="#8b5cf6" />
  <path d="M152 292v16M144 300h16" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
  <rect x="190" y="290" width="140" height="20" rx="10" fill="#e2e8f0" />
  <rect x="354" y="286" width="40" height="28" rx="8" fill="#ede9fe" />
  <text x="374" y="305" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#5b21b6" text-anchor="middle">OT</text>

  <!-- Row 4: Holiday (Blue) -->
  <circle cx="152" cy="360" r="18" fill="#3b82f6" />
  <circle cx="152" cy="360" r="7" fill="#ffffff" />
  <rect x="190" y="350" width="110" height="20" rx="10" fill="#e2e8f0" />
  <rect x="354" y="346" width="40" height="28" rx="8" fill="#dbeafe" />
  <text x="374" y="365" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">H</text>
</svg>
