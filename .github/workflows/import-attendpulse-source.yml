name: Import AttendPulse source archive

on:
  push:
    branches:
      - main
    paths:
      - archive.parts/**

permissions:
  contents: write

jobs:
  import-source:
    if: ${{ !contains(github.event.head_commit.message, 'Import AttendPulse SEO-ready source files') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d archive.parts
          cat archive.parts/part-* > /tmp/AttendPulse-seo-ready.zip.b64
          base64 --decode /tmp/AttendPulse-seo-ready.zip.b64 > /tmp/AttendPulse-seo-ready.zip
          mkdir -p /tmp/attendpulse-import
          unzip -q /tmp/AttendPulse-seo-ready.zip -d /tmp/attendpulse-import
          cp -a /tmp/attendpulse-import/. .
          rm -rf /tmp/attendpulse-import /tmp/AttendPulse-seo-ready.zip /tmp/AttendPulse-seo-ready.zip.b64 archive.parts

      - name: Commit imported source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import AttendPulse SEO-ready source files"
          git push origin HEAD:main
